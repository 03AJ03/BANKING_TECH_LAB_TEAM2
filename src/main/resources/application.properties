spring.application.name=demo

# Database Connection Configuration (Environment Variables with Localhost Fallback)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Development mode: auto-creates and updates tables in banking_db without dropping existing tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

