spring.application.name=demo

# Database Connection Configuration (Environment Variables with Localhost Fallback)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Development mode: auto-creates and updates tables in banking_db without dropping existing tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# jwt.secret must be Base64-encoded and decode to >= 32 bytes (HS256).
# Override both via env vars in real deployments; these are dev-only defaults.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# Initial ADMIN bootstrap (see README "Initial ADMIN" section).
# INITIAL_ADMIN_PASSWORD is required to create the very first ADMIN; if it's
# not set, AdminInitializer just skips bootstrap (logs a warning) instead of
# failing startup. Never put a real password on the line below — env var only.
app.security.initial-admin-username=${INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin-email=${INITIAL_ADMIN_EMAIL:admin@bank.local}
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}

